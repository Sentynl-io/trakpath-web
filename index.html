<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrakPath | One Label. One Immutable Truth.</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./styles.css">
</head>
<body class="bg-black text-white overflow-x-hidden selection:bg-blue-500/30">

    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute top-[-10%] right-[-10%] w-[60vw] h-[60vw] bg-glow-blue rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[20%] left-[-10%] w-[50vw] h-[50vw] bg-glow-indigo rounded-full blur-[120px]"></div>
    </div>

    <nav class="fixed w-full z-50 nav-blur top-0">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2 cursor-pointer group" onclick="switchTab('home')">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center group-hover:bg-blue-500 transition-colors">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
                </div>
                <span class="text-xl font-black tracking-tighter uppercase">Trak<span class="text-blue-500">Path</span></span>
            </div>
            <div class="hidden xl:flex space-x-6 text-sm font-medium text-zinc-400">
                <button onclick="switchTab('advantage')" class="nav-link hover:text-white">Advantage</button>
                <button onclick="switchTab('crisis')" class="nav-link hover:text-white">Market Crisis</button>
                <button onclick="switchTab('features')" class="nav-link hover:text-white">Features</button>
                <button onclick="switchTab('hydration')" class="nav-link hover:text-white">Hydration</button>
                <button onclick="switchTab('coc')" class="nav-link hover:text-white">Chain of Custody</button>
                <button onclick="switchTab('efficiency')" class="nav-link hover:text-white text-emerald-400">Efficiency</button>
                <button onclick="switchTab('compliance')" class="nav-link hover:text-white">Compliance</button>
                <button onclick="switchTab('faq')" class="nav-link hover:text-white">FAQ</button>
            </div>
            <button onclick="openModal('contact')" class="bg-white text-black px-5 py-2 rounded-xl text-sm font-bold hover:bg-zinc-200">
                Contact Team
            </button>
        </div>
    </nav>

    <div id="main-content" class="relative z-10"></div>

    <footer class="relative z-10 mt-20 pt-20 border-t border-white/5 max-w-7xl mx-auto px-6 pb-10">
        <div class="bg-[#0c0c0c] border border-white/5 rounded-[2rem] p-10 md:p-16 relative overflow-hidden text-center">
            <h2 class="text-3xl md:text-4xl font-black tracking-tighter uppercase mb-6">Secure your supply chain.</h2>
            <div class="flex flex-col md:flex-row items-center justify-center gap-6">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center"><i class="fas fa-envelope text-zinc-400"></i></div>
                    <div class="text-left">
                        <p class="text-[10px] text-zinc-500 uppercase tracking-widest font-bold">Inquiries</p>
                        <p class="text-white font-medium">info@mijory.com</p>
                    </div>
                </div>
                <div class="h-8 w-[1px] bg-white/10 hidden md:block"></div>
                <button onclick="openModal('contact')" class="px-8 py-4 bg-white text-black rounded-xl font-bold hover:bg-zinc-200 transition-colors">
                    Schedule a Demo
                </button>
            </div>
            <p class="mt-12 text-zinc-600 text-[10px] tracking-[0.3em] uppercase">TrakPath | Powered by Mijory &copy; 2026. U.S. Patent Pending.</p>
        </div>
    </footer>

    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-content relative p-8">
            <button onclick="closeModal()" class="absolute top-6 right-6 text-zinc-500 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            <h3 id="modalTitle" class="text-2xl font-black uppercase tracking-tighter text-white mb-6 border-b border-white/10 pb-4">Title</h3>
            <div id="modalBody" class="text-zinc-400 text-sm leading-relaxed"></div>
        </div>
    </div>

    <script src="./app.js"></script>
</body>
</html>
