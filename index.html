<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrakPath | One Label. One Immutable Truth.</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@700;800;900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./styles.css">
</head>

<body class="bg-black text-white overflow-x-hidden selection:bg-blue-500/30">

    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute top-[-10%] right-[-10%] w-[60vw] h-[60vw] bg-glow-blue rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[20%] left-[-10%] w-[50vw] h-[50vw] bg-glow-indigo rounded-full blur-[120px]"></div>
    </div>

    <nav class="fixed w-full z-50 nav-blur top-0 border-b border-white/5">
        <div class="max-w-[1400px] mx-auto px-4 md:px-6 py-4 flex justify-between items-center gap-6">
            
            <div class="flex items-center gap-2 cursor-pointer group shrink-0" onclick="switchTab('home'); closeMobileMenu()">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center group-hover:bg-blue-500 transition-colors shrink-0">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path>
                    </svg>
                </div>
                <span class="text-xl font-black tracking-tighter uppercase hidden sm:block">Trak<span class="text-blue-500">Path</span></span>
            </div>

            <div class="hidden xl:flex justify-center gap-4 2xl:gap-6 text-[13px] 2xl:text-sm font-medium text-zinc-400 whitespace-nowrap">
                <button onclick="switchTab('advantage')" class="nav-link hover:text-white transition-colors">Advantage</button>
                <button onclick="switchTab('crisis')" class="nav-link hover:text-white transition-colors">Market Crisis</button>
                <button onclick="switchTab('features')" class="nav-link hover:text-white transition-colors">Features</button>
                <button onclick="switchTab('hydration')" class="nav-link hover:text-white transition-colors">Hydration</button>
                <button onclick="switchTab('coc')" class="nav-link hover:text-white transition-colors">Chain of Custody</button>
                <button onclick="switchTab('efficiency')" class="nav-link hover:text-white text-emerald-400 transition-colors">Efficiency</button>
                <button onclick="switchTab('compliance')" class="nav-link hover:text-white transition-colors">Compliance</button>
                <button onclick="switchTab('pricing')" class="nav-link hover:text-white transition-colors">Pricing</button>
                <button onclick="switchTab('references')" class="nav-link hover:text-white transition-colors">References</button>
                <button onclick="switchTab('faq')" class="nav-link hover:text-white transition-colors">FAQ</button>
            </div>

            <div class="flex items-center gap-3 shrink-0">
                <button onclick="openModal('contact')" class="hidden md:block border border-zinc-700 text-white px-5 py-2 rounded-xl text-sm font-bold hover:bg-zinc-800 transition-colors whitespace-nowrap">
                    Contact Team
                </button>

                <a href="https://dzesho6xn6ryq.cloudfront.net/" class="bg-blue-600 text-white px-4 md:px-5 py-2 rounded-xl text-sm font-bold hover:bg-blue-500 transition-all flex items-center gap-2 shadow-lg shadow-blue-900/20 whitespace-nowrap">
                    <span class="hidden sm:inline">Console Sign In</span>
                    <span class="sm:hidden">Sign In</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
                    </svg>
                </a>

                <button id="mobileMenuBtn" onclick="toggleMobileMenu()" class="xl:hidden p-2 text-zinc-400 hover:text-white transition-colors focus:outline-none">
                    <i id="menuIcon" class="fas fa-bars text-2xl"></i>
                </button>
            </div>
        </div>

        <div id="mobileMenu" class="hidden xl:hidden absolute top-full left-0 w-full bg-black/95 backdrop-blur-2xl border-b border-white/10 shadow-2xl">
            <div class="flex flex-col px-6 py-6 space-y-4 text-lg font-bold text-zinc-400">
                <button onclick="switchTab('advantage'); closeMobileMenu()" class="text-left hover:text-white transition-colors">Advantage</button>
                <button onclick="switchTab('crisis'); closeMobileMenu()" class="text-left hover:text-white transition-colors">Market Crisis</button>
                <button onclick="switchTab('features'); closeMobileMenu()" class="text-left hover:text-white transition-colors">Features</button>
                <button onclick="switchTab('hydration'); closeMobileMenu()" class="text-left hover:text-white transition-colors">Hydration Engine</button>
                <button onclick="switchTab('coc'); closeMobileMenu()" class="text-left hover:text-white transition-colors">Chain of Custody</button>
                <button onclick="switchTab('efficiency'); closeMobileMenu()" class="text-left hover:text-white text-emerald-400 transition-colors">Efficiency</button>
                <button onclick="switchTab('compliance'); closeMobileMenu()" class="text-left hover:text-white transition-colors">Compliance</button>
                <button onclick="switchTab('pricing'); closeMobileMenu()" class="text-left hover:text-white transition-colors">Pricing</button>
                <button onclick="switchTab('references'); closeMobileMenu()" class="text-left hover:text-white transition-colors">References</button>
                <button onclick="switchTab('faq'); closeMobileMenu()" class="text-left hover:text-white transition-colors">FAQ</button>
                
                <hr class="border-white/10 my-2">
                <button onclick="openModal('contact'); closeMobileMenu()" class="text-left text-blue-400 hover:text-blue-300 transition-colors">Contact Executive Team</button>
            </div>
        </div>
    </nav>

    <div id="main-content" class="relative z-10"></div>

    <footer class="relative z-10 mt-20 pt-20 border-t border-white/5 max-w-7xl mx-auto px-6 pb-10">
        <div class="bg-[#0c0c0c] border border-white/5 rounded-[2rem] p-10 md:p-16 relative overflow-hidden text-center">
            <h2 class="text-3xl md:text-4xl font-black tracking-tighter uppercase mb-6">Secure your supply chain.</h2>
            <div class="flex flex-col md:flex-row items-center justify-center gap-6">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center"><i
                            class="fas fa-envelope text-zinc-400"></i></div>
                    <div class="text-left">
                        <p class="text-[10px] text-zinc-500 uppercase tracking-widest font-bold">Inquiries</p>
                        <p class="text-white font-medium">info@mijory.com</p>
                    </div>
                </div>
                <div class="h-8 w-[1px] bg-white/10 hidden md:block"></div>
                <button onclick="openModal('contact')"
                    class="px-8 py-4 bg-white text-black rounded-xl font-bold hover:bg-zinc-200 transition-colors">
                    Schedule a Demo
                </button>
            </div>
            <p class="mt-12 text-zinc-600 text-[10px] tracking-[0.3em] uppercase">TrakPath | Powered by Mijory &copy;
                2026. U.S. Patent Pending.</p>
        </div>
    </footer>

    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-content relative p-8">
            <button onclick="closeModal()" class="absolute top-6 right-6 text-zinc-500 hover:text-white"><i
                    class="fas fa-times text-xl"></i></button>
            <h3 id="modalTitle"
                class="text-2xl font-black uppercase tracking-tighter text-white mb-6 border-b border-white/10 pb-4">
                Title</h3>
            <div id="modalBody" class="text-zinc-400 text-sm leading-relaxed"></div>
        </div>
    </div>

    <script src="./app.js"></script>

    <script>
        const mobileMenu = document.getElementById('mobileMenu');
        const menuIcon = document.getElementById('menuIcon');

        function toggleMobileMenu() {
            if (mobileMenu.classList.contains('hidden')) {
                mobileMenu.classList.remove('hidden');
                menuIcon.classList.remove('fa-bars');
                menuIcon.classList.add('fa-times'); // Change to X
            } else {
                closeMobileMenu();
            }
        }

        function closeMobileMenu() {
            mobileMenu.classList.add('hidden');
            menuIcon.classList.remove('fa-times');
            menuIcon.classList.add('fa-bars'); // Change back to hamburger
        }
    </script>
</body>

</html>
